# Static GitHub Pages deployment
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clear stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          stale_sha="61df4ce02fca4465371080562faa34ca05a695b3"
          gh api --method POST "repos/$repo/pages/deployments/$stale_sha/cancel"
          deployments="$(gh api "repos/$repo/deployments?sha=$stale_sha")"
          deployment_id="$(printf '%s' "$deployments" | jq -r '.[] | select(.environment == "github-pages") | .id' | head -n 1)"
          if [ -n "${deployment_id:-}" ]; then
            echo "Deactivating stale deployment $deployment_id"
            gh api --method POST "repos/$repo/deployments/$deployment_id/statuses" -f state=inactive
            gh api --method DELETE "repos/$repo/deployments/$deployment_id"
          else
            echo "No matching active deployment record found."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

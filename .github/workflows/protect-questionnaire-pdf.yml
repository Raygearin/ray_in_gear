name: Protect questionnaire PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/protect-questionnaire-pdf.yml"

permissions:
  contents: write

jobs:
  encrypt-and-remove-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Encrypt PDF and remove public original
        env:
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python - <<'PY'
          from pathlib import Path
          import os
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          source = Path("Interests_Boundaries_Mobile_Contact_Final.pdf.pdf")
          target = Path("assets/questionnaire.enc")
          password = os.environ.get("PDF_PASSWORD", "")
          if not password:
              raise SystemExit("Missing repository secret PDF_PASSWORD.")
          if not source.is_file():
              raise SystemExit(f"Source PDF not found: {source}")

          salt = os.urandom(16)
          iv = os.urandom(12)
          kdf = PBKDF2HMAC(
              algorithm=hashes.SHA256(),
              length=32,
              salt=salt,
              iterations=310000,
          )
          key = kdf.derive(password.encode("utf-8"))
          ciphertext = AESGCM(key).encrypt(
              iv,
              source.read_bytes(),
              b"RayInGearPDF-v1",
          )
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(b"RAYPDF01" + salt + iv + ciphertext)
          source.unlink()
          print(f"Encrypted PDF created at {target}; original removed from working tree.")

      - name: Commit encrypted PDF and deletion of original
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Encrypt questionnaire PDF and remove public source"
          git push

name: Rebuild GitHub Pages from main

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Set GitHub Pages source to main root and request a branch build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' | gh api --method PUT "repos/$GH_REPO/pages" --input -
          gh api --method POST "repos/$GH_REPO/pages/builds"
